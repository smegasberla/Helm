[package]
name = "helm-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Disk, partition and operating system detection for Helm"

[dependencies]
helm-protocol.workspace = true
helm-boot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log = "0.4"
ntfs = "0.4"
fatfs = "0.3"
ruzstd = "0.9"
flate2 = "1"
positioned-io = "0.2"
byteorder = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }

[dev-dependencies]
flate2 = "1"
zstd = "0.13"
